name: Release

# Ship a versioned DMG on every version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# The DMG is the single artifact behind both distribution channels:
# direct download (GitHub Release) and Homebrew (Cask points at this DMG).
# The tag is the single source of truth for the version: package-dmg.sh
# stamps it into Info.plist and refuses to go backwards over a plist
# that's already ahead (a stale-tag guard, not a silent overwrite).
#
# Optional Homebrew-tap auto-update: set repository Settings → Secrets →
# Actions → HOMEBREW_TAP_TOKEN (a fine-grained PAT with contents:write on
# your tap repo, e.g. henryle97/homebrew-tap) and optionally the
# HOMEBREW_TAP_REPO variable (defaults to henryle97/homebrew-tap).
# Without the secret the workflow still publishes the DMG and prints the
# ready-to-paste Cask update in the job summary.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0, without leading v)"
        required: true

permissions:
  contents: write
  id-token: write # for attest-build-provenance's Sigstore/Fulcio OIDC
  attestations: write

jobs:
  release:
    runs-on: macos-15 # arm64; macos-14 is deprecated
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # v1.0.0-rc.1 / v1.0.0-beta -> GitHub prerelease.
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Check for existing release
        id: check_release
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already published (e.g. via scripts/release-local.sh) — nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build app and package DMG
        if: steps.check_release.outputs.exists != 'true'
        run: ./scripts/package-dmg.sh --version "$VERSION"

      - name: Attest DMG build provenance
        if: steps.check_release.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/LookAround-${{ env.VERSION }}.dmg"

      - name: Prepare Cask update
        if: steps.check_release.outputs.exists != 'true'
        run: |
          SHA=$(awk '{print $1}' "dist/LookAround-${VERSION}.dmg.sha256")
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          sed -e "s/^  version .*/  version \"${VERSION}\"/" \
              -e "s/^  sha256 .*/  sha256 \"${SHA}\"/" \
              packaging/homebrew/Casks/lookaround.rb > /tmp/lookaround.rb
          cp /tmp/lookaround.rb "dist/lookaround.rb"
          {
            echo "### Homebrew Cask update (paste into your tap's Casks/lookaround.rb)"
            echo '```ruby'
            cat dist/lookaround.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release with DMG
        if: steps.check_release.outputs.exists != 'true'
        run: |
          NOTES=$(mktemp)
          sed -e "s/__VERSION__/${VERSION}/g" packaging/homebrew/RELEASE-NOTES.md > "$NOTES"
          # shellcheck disable=SC2086  # intentionally unquoted: expands to
          # nothing (not an empty arg) when PRERELEASE_FLAG is unset.
          gh release create "v${VERSION}" \
            --title "LookAround v${VERSION}" \
            --notes-file "$NOTES" \
            $PRERELEASE_FLAG \
            "dist/LookAround-${VERSION}.dmg#LookAround-${VERSION}.dmg"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push Cask update to tap repo
        # `secrets` isn't a valid context for step `if:` (only github, needs,
        # strategy, matrix, job, runner, env, vars, steps, inputs are), so
        # the token is checked inside the script instead.
        if: steps.check_release.outputs.exists != 'true'
        run: |
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping tap auto-update"
            exit 0
          fi
          TAP_REPO="${TAP_REPO:-henryle97/homebrew-tap}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/tap && git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" /tmp/tap
          mkdir -p /tmp/tap/Casks
          cp dist/lookaround.rb /tmp/tap/Casks/lookaround.rb
          cd /tmp/tap
          git add Casks/lookaround.rb
          git diff --cached --quiet && echo "tap already up to date" && exit 0
          git commit -m "lookaround ${VERSION}"
          git push origin HEAD
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
